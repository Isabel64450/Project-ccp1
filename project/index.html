<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evenements</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Mes Evenements</h1>
      <select id="theme">
        <option value="obscure">Theme Obscure</option>
        <option value="clair">Theme Clair</option>
      </select>
    </header>
    <main>
      <div id="listeEvenements"></div>
      <div id="messageErreur" class="erreur" style="display: none"></div>
      <h2>Mon Planning</h2>
      <div id="planning"></div>
      <div id="modale" class="modale">
        <div class="modale-contenu">
          <span class="fermer" id="fermer">&times;</span>
          <h2 id="modaleTitre"></h2>
          <p><strong>Date :</strong> <span id="modaleDate"></span></p>
          <p><strong>Lieu :</strong> <span id="modaleLieu"></span></p>
          <p id="modaleDescription"></p>
          <strong>Voir l'événement : </strong>
          <a id="modaleUrl" href="#" target="_blank" rel="noopener noreferrer"
            >Lien vers l'événement</a
          >
        </div>
      </div>
    </main>
    <template id="templateEvenement">
      <div class="carte">
        <h2 class="titre"></h2>
        <p><strong>Date :</strong> <span class="date"></span></p>
        <p><strong>Lieu :</strong> <span class="lieu"></span></p>

        <p class="description"></p>
        <div class="actions">
          <button class="voir">Voir détail</button>
          <button class="ajouter">Ajouter</button>
        </div>
      </div>
    </template>
  </body>
  <script src="scritp.js"></script>
</html>
